openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Imported LMS client records
  - name: ckyc
    description: CKYC request and response files
  - name: ckyc-create-data
    description: Imported CKYC Create portal results
  - name: dashboard
    description: Workspace overview
  - name: auth
    description: Signed-in application user
  - name: admin
    description: Administrator user and audit controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentAppUser
      tags: [auth]
      summary: Get the current signed-in application user
      responses:
        "200":
          description: Current application user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAppUserResponse"
        "401":
          description: Sign-in required
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with the local administrator account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in application user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAppUserResponse"
        "401":
          description: Invalid credentials
        "503":
          description: Authentication unavailable
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List application users and roles
      responses:
        "200":
          description: Users available for role management
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "403":
          description: Administrator access required
  /admin/users/{userId}/role:
    patch:
      operationId: updateAdminUserRole
      tags: [admin]
      summary: Update an application's user role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUserRoleUpdate"
      responses:
        "200":
          description: Updated application user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAppUserResponse"
        "400":
          description: Invalid role
        "403":
          description: Administrator access required
        "404":
          description: User not found
        "409":
          description: The last administrator cannot be demoted
  /admin/audit-trails:
    get:
      operationId: listAuditTrails
      tags: [admin]
      summary: List recent audit trail events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            default: 0
      responses:
        "200":
          description: Audit events ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTrailsResponse"
        "403":
          description: Administrator access required
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get workspace summary
      responses:
        "200":
          description: Workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /clients/export:
    get:
      operationId: exportClients
      tags: [clients]
      summary: Export client CKYC results as CSV
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter clients by CKYC progress; matched includes a response ID or final CKYC number, while pending includes neither
          schema:
            type: string
            enum: [matched, error, awaiting, pending]
      responses:
        "200":
          description: CSV report of matching clients and their CKYC results
          content:
            text/csv:
              schema:
                type: string
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List imported clients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          description: Filter to one stored client record by database ID
          schema:
            type: number
            minimum: 1
        - name: status
          in: query
          required: false
          description: Filter clients by CKYC progress; matched includes a response ID or final CKYC number, while pending includes neither
          schema:
            type: string
            enum: [matched, error, awaiting, pending]
        - name: finfluxGroup
          in: query
          required: false
          description: Filter pending FinFlux records by readiness group. Request ID and records-pending groups are view-only until a final CKYC number is available.
          schema:
            type: string
            enum: [finalCkyc, requestIdUpdated, recordsPending]
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 1000000
            default: 50
      responses:
        "200":
          description: Paginated client records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
    post:
      operationId: importClients
      tags: [clients]
      summary: Import client rows from an LMS export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientImportInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finflux/ckyc-import/preview:
    post:
      operationId: previewFinfluxCkycImport
      tags: [finflux]
      summary: Preview a Finflux CKYC update spreadsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinfluxCkycImportPreviewInput"
      responses:
        "200":
          description: Parsed rows ready for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinfluxCkycImportPreviewResponse"
        "400":
          description: Invalid file or missing columns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /finflux/ckyc-update-jobs:
    post:
      operationId: createFinfluxCkycUpdateJob
      tags: [finflux]
      summary: Authenticate with Finflux and start a CKYC identifier update job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinfluxCkycUpdateJobInput"
      responses:
        "202":
          description: Update job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinfluxCkycUpdateJobAccepted"
        "400":
          description: Invalid update records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Finflux authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many active Finflux update jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Finflux is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getFinfluxCkycUpdateJob
      tags: [finflux]
      summary: Get Finflux CKYC update job progress and results
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current update job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinfluxCkycUpdateJob"
        "404":
          description: Update job not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/requests:
    get:
      operationId: listCkycRequests
      tags: [ckyc]
      summary: List generated CKYC files
      responses:
        "200":
          description: Recent CKYC requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CkycRequest"
    post:
      operationId: generateCkycRequest
      tags: [ckyc]
      summary: Generate a CKYC search request file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycRequestInput"
      responses:
        "201":
          description: Generated request file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycFile"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/create-data:
    get:
      operationId: listCkycCreateData
      tags: [ckyc-create-data]
      summary: List imported CKYC Create results
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: importId
          in: query
          required: false
          schema:
            type: number
            minimum: 1
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        "200":
          description: Paginated CKYC Create rows with matched LMS client data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycCreateDataList"
    post:
      operationId: importCkycCreateData
      tags: [ckyc-create-data]
      summary: Import CKYC Create portal results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycCreateDataImportInput"
      responses:
        "201":
          description: Imported CKYC Create rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycCreateDataImportResult"
        "400":
          description: Invalid CKYC Create file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/create-data/batches:
    get:
      operationId: listCkycCreateDataBatches
      tags: [ckyc-create-data]
      summary: List CKYC Create import batches
      responses:
        "200":
          description: Batch summaries with match counts and report status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CkycCreateDataBatch"
  /ckyc/create-data/export:
    get:
      operationId: exportCkycCreateData
      tags: [ckyc-create-data]
      summary: Export one CKYC Create batch report
      parameters:
        - name: importId
          in: query
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: CSV report for one import batch
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Import batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/requests/{id}:
    get:
      operationId: getCkycRequest
      tags: [ckyc]
      summary: Get a generated request and its response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycRequestDetail"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/requests/{id}/response:
    post:
      operationId: uploadCkycResponse
      tags: [ckyc]
      summary: Save a CKYC response file for a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycResponseInput"
      responses:
        "200":
          description: Saved response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycRequestDetail"
        "400":
          description: Invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests:
    get:
      operationId: listCkycDownloadRequests
      tags: [ckyc]
      summary: List generated CKYC download request files
      responses:
        "200":
          description: Recent CKYC download requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CkycDownloadRequest"
    post:
      operationId: generateCkycDownloadRequest
      tags: [ckyc]
      summary: Generate a CKYC download request for clients with CKYC response IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycDownloadRequestInput"
      responses:
        "201":
          description: Generated CKYC download request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadRequestDetail"
        "400":
          description: No eligible CKYC response IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/{id}/file:
    get:
      operationId: downloadCkycDownloadRequestFile
      tags: [ckyc]
      summary: Download a previously generated CKYC request file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Previously generated CKYC request TXT file
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/{id}/response-file:
    get:
      operationId: downloadCkycDownloadResponseFile
      tags: [ckyc]
      summary: Download the uploaded final CKYC response file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Uploaded final CKYC response file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Final response file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/response-files:
    get:
      operationId: listCkycDownloadResponseFiles
      tags: [ckyc]
      summary: List uploaded final CKYC response files
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Recently uploaded final CKYC response files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CkycDownloadResponseFile"
  /ckyc/download-requests/response-files/{id}/archive:
    post:
      operationId: archiveCkycDownloadResponseFile
      tags: [ckyc]
      summary: Archive an uploaded final CKYC response file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Archived response file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadResponseFile"
        "404":
          description: Uploaded response file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/response-files/{id}/restore:
    post:
      operationId: restoreCkycDownloadResponseFile
      tags: [ckyc]
      summary: Restore an archived final CKYC response file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Restored response file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadResponseFile"
        "404":
          description: Uploaded response file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/response-files/{id}/file:
    get:
      operationId: downloadCkycDownloadResponseRecordFile
      tags: [ckyc]
      summary: Download an uploaded final CKYC response file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Uploaded final CKYC response file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Uploaded response file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/response:
    post:
      operationId: uploadCkycDownloadResponse
      tags: [ckyc]
      summary: Save a CKYC download response Excel or TXT file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycDownloadResponseInput"
      responses:
        "200":
          description: Final KYC numbers saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadResponse"
        "400":
          description: Invalid Excel response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/batch:
    post:
      operationId: generateCkycDownloadRequestBatch
      tags: [ckyc]
      summary: Generate split CKYC download request files from uploaded client references
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycDownloadBatchRequestInput"
      responses:
        "201":
          description: Generated CKYC download request lots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadRequestBatchResponse"
        "400":
          description: No eligible clients found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AppRole:
      type: string
      enum: [admin, manager, viewer]
    AppUser:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          description: Verified primary email on the identity provider account
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/AppRole"
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: ["string", "null"]
          format: date-time
      required: [userId, email, fullName, role, createdAt, lastSeenAt]
    CurrentAppUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AppUser"
      required: [user]
    AdminUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AppUser"
      required: [users]
    AppUserRoleUpdate:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AppRole"
      required: [role]
    AuditTrailEntry:
      type: object
      properties:
        id:
          type: number
        actorUserId:
          type: string
        actorEmail:
          type: ["string", "null"]
        actorRole:
          $ref: "#/components/schemas/AppRole"
        method:
          type: string
        path:
          type: string
        statusCode:
          type: number
        requestId:
          type: ["string", "null"]
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - actorUserId
        - actorEmail
        - actorRole
        - method
        - path
        - statusCode
        - requestId
        - metadata
        - createdAt
    AuditTrailsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditTrailEntry"
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
      required: [events, total, limit, offset]
    Client:
      type: object
      properties:
        id:
          type: number
        loanid:
          type: string
        ClientID:
          type: string
        disbursedon_date:
          type: string
        Client_UID:
          type: string
          description: Returned masked as XXXXXXXX plus the final four UID digits
        Client_VID:
          type: string
        Client_PAN:
          type: string
        ClientName:
          type: string
        mobile_no:
          type: string
        alternate_mobile_no:
          type: string
        Gender:
          type: string
        date_of_birth:
          type: string
        createdAt:
          type: string
          format: date-time
        ckycResponseId:
          type: ["string", "null"]
        ckycNumber:
          type: ["string", "null"]
        ckycResponseStatus:
          type: ["string", "null"]
          enum: [matched, error, null]
        ckycResponseError:
          type: ["string", "null"]
        ckycResponseMatchedBy:
          type: ["string", "null"]
        ckycResponseMatchStatus:
          type: ["string", "null"]
          enum: ["Properly Match", "Match", "Match via Create CKYC", "Not Match", null]
        ckycResponseRequestLine:
          type: ["string", "null"]
        ckycResponseMatchedRow:
          type: ["string", "null"]
        ckycResponseFileName:
          type: ["string", "null"]
        ckycResponseRequestId:
          type: ["number", "null"]
        ckycResponseAt:
          type: ["string", "null"]
          format: date-time
        finfluxCkycUpdatedAt:
          type: ["string", "null"]
          format: date-time
        finfluxResourceId:
          type: ["string", "null"]
        finfluxStatus:
          type: ["string", "null"]
          enum: [updated, failed, pending, null]
        finfluxError:
          type: ["string", "null"]
        finfluxStatusCode:
          type: ["number", "null"]
        finfluxAttemptedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - loanid
        - ClientID
        - disbursedon_date
        - Client_UID
        - Client_VID
        - Client_PAN
        - ClientName
        - mobile_no
        - alternate_mobile_no
        - Gender
        - date_of_birth
        - createdAt
        - ckycResponseId
        - ckycNumber
        - ckycResponseStatus
        - ckycResponseError
        - ckycResponseMatchedBy
        - ckycResponseMatchStatus
        - ckycResponseRequestLine
        - ckycResponseMatchedRow
        - ckycResponseFileName
        - ckycResponseRequestId
        - ckycResponseAt
        - finfluxCkycUpdatedAt
        - finfluxResourceId
        - finfluxStatus
        - finfluxError
        - finfluxStatusCode
        - finfluxAttemptedAt
    ClientInput:
      type: object
      properties:
        loanid:
          type: string
        ClientID:
          type: string
        disbursedon_date:
          type: string
        Client_UID:
          type: string
          description: Raw UID from the LMS import; only XXXXXXXX plus the final four digits are stored
        Client_VID:
          type: string
        Client_PAN:
          type: string
        ClientName:
