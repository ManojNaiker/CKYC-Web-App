openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Imported LMS client records
  - name: ckyc
    description: CKYC request and response files
  - name: ckyc-create-data
    description: Imported CKYC Create portal results
  - name: dashboard
    description: Workspace overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get workspace summary
      responses:
        "200":
          description: Workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /clients/export:
    get:
      operationId: exportClients
      tags: [clients]
      summary: Export client CKYC results as CSV
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter clients by CKYC progress; matched includes a response ID or final CKYC number, while pending includes neither
          schema:
            type: string
            enum: [matched, error, awaiting, pending]
      responses:
        "200":
          description: CSV report of matching clients and their CKYC results
          content:
            text/csv:
              schema:
                type: string
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List imported clients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          description: Filter to one stored client record by database ID
          schema:
            type: number
            minimum: 1
        - name: status
          in: query
          required: false
          description: Filter clients by CKYC progress; matched includes a response ID or final CKYC number, while pending includes neither
          schema:
            type: string
            enum: [matched, error, awaiting, pending]
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 1000000
            default: 50
      responses:
        "200":
          description: Paginated client records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
    post:
      operationId: importClients
      tags: [clients]
      summary: Import client rows from an LMS export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientImportInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/requests:
    get:
      operationId: listCkycRequests
      tags: [ckyc]
      summary: List generated CKYC files
      responses:
        "200":
          description: Recent CKYC requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CkycRequest"
    post:
      operationId: generateCkycRequest
      tags: [ckyc]
      summary: Generate a CKYC search request file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycRequestInput"
      responses:
        "201":
          description: Generated request file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycFile"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/create-data:
    get:
      operationId: listCkycCreateData
      tags: [ckyc-create-data]
      summary: List imported CKYC Create results
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: importId
          in: query
          required: false
          schema:
            type: number
            minimum: 1
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        "200":
          description: Paginated CKYC Create rows with matched LMS client data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycCreateDataList"
    post:
      operationId: importCkycCreateData
      tags: [ckyc-create-data]
      summary: Import CKYC Create portal results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycCreateDataImportInput"
      responses:
        "201":
          description: Imported CKYC Create rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycCreateDataImportResult"
        "400":
          description: Invalid CKYC Create file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/create-data/batches:
    get:
      operationId: listCkycCreateDataBatches
      tags: [ckyc-create-data]
      summary: List CKYC Create import batches
      responses:
        "200":
          description: Batch summaries with match counts and report status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CkycCreateDataBatch"
  /ckyc/create-data/export:
    get:
      operationId: exportCkycCreateData
      tags: [ckyc-create-data]
      summary: Export one CKYC Create batch report
      parameters:
        - name: importId
          in: query
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: CSV report for one import batch
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Import batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/requests/{id}:
    get:
      operationId: getCkycRequest
      tags: [ckyc]
      summary: Get a generated request and its response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycRequestDetail"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/requests/{id}/response:
    post:
      operationId: uploadCkycResponse
      tags: [ckyc]
      summary: Save a CKYC response file for a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycResponseInput"
      responses:
        "200":
          description: Saved response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycRequestDetail"
        "400":
          description: Invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests:
    get:
      operationId: listCkycDownloadRequests
      tags: [ckyc]
      summary: List generated CKYC download request files
      responses:
        "200":
          description: Recent CKYC download requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CkycDownloadRequest"
    post:
      operationId: generateCkycDownloadRequest
      tags: [ckyc]
      summary: Generate a CKYC download request for clients with CKYC response IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycDownloadRequestInput"
      responses:
        "201":
          description: Generated CKYC download request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadRequestDetail"
        "400":
          description: No eligible CKYC response IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/{id}/file:
    get:
      operationId: downloadCkycDownloadRequestFile
      tags: [ckyc]
      summary: Download a previously generated CKYC request file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Previously generated CKYC request TXT file
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/{id}/response-file:
    get:
      operationId: downloadCkycDownloadResponseFile
      tags: [ckyc]
      summary: Download the uploaded final CKYC response file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Uploaded final CKYC response file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Final response file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/response-files:
    get:
      operationId: listCkycDownloadResponseFiles
      tags: [ckyc]
      summary: List uploaded final CKYC response files
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Recently uploaded final CKYC response files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CkycDownloadResponseFile"
  /ckyc/download-requests/response-files/{id}/archive:
    post:
      operationId: archiveCkycDownloadResponseFile
      tags: [ckyc]
      summary: Archive an uploaded final CKYC response file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Archived response file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadResponseFile"
        "404":
          description: Uploaded response file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/response-files/{id}/restore:
    post:
      operationId: restoreCkycDownloadResponseFile
      tags: [ckyc]
      summary: Restore an archived final CKYC response file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Restored response file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadResponseFile"
        "404":
          description: Uploaded response file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/response-files/{id}/file:
    get:
      operationId: downloadCkycDownloadResponseRecordFile
      tags: [ckyc]
      summary: Download an uploaded final CKYC response file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Uploaded final CKYC response file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Uploaded response file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/response:
    post:
      operationId: uploadCkycDownloadResponse
      tags: [ckyc]
      summary: Save a CKYC download response Excel or TXT file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycDownloadResponseInput"
      responses:
        "200":
          description: Final KYC numbers saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadResponse"
        "400":
          description: Invalid Excel response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ckyc/download-requests/batch:
    post:
      operationId: generateCkycDownloadRequestBatch
      tags: [ckyc]
      summary: Generate split CKYC download request files from uploaded client references
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CkycDownloadBatchRequestInput"
      responses:
        "201":
          description: Generated CKYC download request lots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CkycDownloadRequestBatchResponse"
        "400":
          description: No eligible clients found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Client:
      type: object
      properties:
        id:
          type: number
        loanid:
          type: string
        ClientID:
          type: string
        disbursedon_date:
          type: string
        Client_UID:
          type: string
          description: Returned masked as XXXXXXXX plus the final four UID digits
        Client_VID:
          type: string
        Client_PAN:
          type: string
        ClientName:
          type: string
        mobile_no:
          type: string
        alternate_mobile_no:
          type: string
        Gender:
          type: string
        date_of_birth:
          type: string
        createdAt:
          type: string
          format: date-time
        ckycResponseId:
          type: ["string", "null"]
        ckycNumber:
          type: ["string", "null"]
        ckycResponseStatus:
          type: ["string", "null"]
          enum: [matched, error, null]
        ckycResponseError:
          type: ["string", "null"]
        ckycResponseMatchedBy:
          type: ["string", "null"]
        ckycResponseMatchStatus:
          type: ["string", "null"]
          enum: ["Properly Match", "Match", "Match via Create CKYC", "Not Match", null]
        ckycResponseRequestLine:
          type: ["string", "null"]
        ckycResponseMatchedRow:
          type: ["string", "null"]
        ckycResponseFileName:
          type: ["string", "null"]
        ckycResponseRequestId:
          type: ["number", "null"]
        ckycResponseAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - loanid
        - ClientID
        - disbursedon_date
        - Client_UID
        - Client_VID
        - Client_PAN
        - ClientName
        - mobile_no
        - alternate_mobile_no
        - Gender
        - date_of_birth
        - createdAt
        - ckycResponseId
        - ckycNumber
        - ckycResponseStatus
        - ckycResponseError
        - ckycResponseMatchedBy
        - ckycResponseMatchStatus
        - ckycResponseRequestLine
        - ckycResponseMatchedRow
        - ckycResponseFileName
        - ckycResponseRequestId
        - ckycResponseAt
    ClientInput:
      type: object
      properties:
        loanid:
          type: string
        ClientID:
          type: string
        disbursedon_date:
          type: string
        Client_UID:
          type: string
          description: Raw UID from the LMS import; only XXXXXXXX plus the final four digits are stored
        Client_VID:
          type: string
        Client_PAN:
          type: string
        ClientName:
          type: string
        mobile_no:
          type: string
        alternate_mobile_no:
          type: string
        Gender:
          type: string
        date_of_birth:
          type: string
      required:
        - loanid
        - ClientID
        - disbursedon_date
        - Client_UID
        - Client_VID
        - Client_PAN
        - ClientName
        - mobile_no
        - alternate_mobile_no
        - Gender
        - date_of_birth
    ClientImportInput:
      type: object
      properties:
        fileName:
          type: string
        headers:
          type: array
          description: Original LMS CSV headers, used to detect missing required columns
          items:
            type: string
        rows:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClientInput"
      required:
        - headers
        - rows
    ClientList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number
      required:
        - items
        - total
        - page
        - pageSize
    ImportResult:
      type: object
      properties:
        imported:
          type: number
        skipped:
          type: number
          description: Rows that were invalid or missing required values
        duplicates:
          type: number
          description: Valid rows already present in the register or repeated in this import
        fileName:
          type: ["string", "null"]
      required:
        - imported
        - skipped
        - duplicates
        - fileName
    CkycCreateDataRow:
      type: object
      properties:
        id:
          type: number
        importId:
          type: number
        sourceFileName:
          type: string
        refId:
          type: string
        clientId:
          type: string
        transactionDate:
          type: ["string", "null"]
        uploadedCkycNumber:
          type: ["string", "null"]
        referenceNumber:
          type: ["string", "null"]
        status:
          type: string
        reason:
          type: ["string", "null"]
        clientName:
          type: ["string", "null"]
        finalCkycNumber:
          type: ["string", "null"]
        clientRecordId:
          type: ["number", "null"]
        matchStatus:
          type: string
          enum: [matched, unmatched]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - importId
        - sourceFileName
        - refId
        - clientId
        - transactionDate
        - uploadedCkycNumber
        - referenceNumber
        - status
        - reason
        - clientName
        - finalCkycNumber
        - clientRecordId
        - matchStatus
        - createdAt
    CkycCreateDataList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CkycCreateDataRow"
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number
      required:
        - items
        - total
        - page
        - pageSize
    CkycCreateDataBatch:
      type: object
      properties:
        id:
          type: number
        sourceFileName:
          type: string
        uploadedCount:
          type: number
        matchedCount:
          type: number
        unmatchedCount:
          type: number
        successCount:
          type: number
        probableMatchCount:
          type: number
        rejectCount:
          type: number
        reportStatus:
          type: string
          enum: [matched, partially_matched, unmatched]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sourceFileName
        - uploadedCount
        - matchedCount
        - unmatchedCount
        - successCount
        - probableMatchCount
        - rejectCount
        - reportStatus
        - createdAt
    CkycCreateDataImportInput:
      type: object
      properties:
        sourceFileName:
          type: string
        fileContentBase64:
          type: string
      required:
        - sourceFileName
        - fileContentBase64
    CkycCreateDataImportResult:
      type: object
      properties:
        importId:
          type: number
        sourceFileName:
          type: string
        imported:
          type: number
        skipped:
          type: number
        unmatchedClientIds:
          type: array
          items:
            type: string
      required:
        - importId
        - sourceFileName
        - imported
        - skipped
        - unmatchedClientIds
    CkycRequestInput:
      type: object
      properties:
        fileDate:
          type: string
          description: Date used in the filename, DDMMYYYY
        version:
          type: string
          default: V1.1
        institutionCode:
          type: string
          default: IN2884
        iraCode:
          type: string
          default: IRA007917
          description: Legacy compatibility field; the type 10 field 4 is the generated record count
        documentSetName:
          type: string
          default: "10022"
          description: Legacy compatibility field; not written to the current bulk-search header
        rowCount:
          type: string
          description: Number of data rows written to the request file
        reprocessPending:
          type: boolean
          description: Allow clients with a previous error and no CKYC response ID to be searched again
        clients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CkycClientInput"
      required:
        - fileDate
        - version
        - institutionCode
        - documentSetName
        - rowCount
        - clients
    CkycClientInput:
      type: object
      properties:
        clientId:
          type: number
        name:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
        searchType:
          type: string
          enum: [E, B]
        searchValue:
          type: string
        sequence:
          type: number
      required:
        - clientId
        - name
        - dateOfBirth
        - gender
        - searchType
        - searchValue
        - sequence
    CkycRequest:
      type: object
      properties:
        id:
          type: number
        fileName:
          type: string
          description: Gateway filename in the format FICODE_DATESTAMP_VERSION_SNNNNNN.txt
        recordCount:
          type: number
        status:
          type: string
          enum: [generated, response_uploaded]
        createdAt:
          type: string
          format: date-time
        responseFileName:
          type: ["string", "null"]
      required:
        - id
        - fileName
        - recordCount
        - status
        - createdAt
        - responseFileName
    CkycFile:
      allOf:
        - $ref: "#/components/schemas/CkycRequest"
        - type: object
          properties:
            content:
              type: string
          required:
            - content
    CkycResponseInput:
      type: object
      properties:
        fileName:
          type: string
        content:
          type: string
      required:
        - fileName
        - content
    CkycRequestDetail:
      allOf:
        - $ref: "#/components/schemas/CkycRequest"
        - type: object
          properties:
            content:
              type: string
            responseContent:
              type: ["string", "null"]
          required:
            - content
            - responseContent
    CkycDownloadRequestInput:
      type: object
      properties:
        clientIds:
          type: array
          minItems: 1
          items:
            type: number
        fileDate:
          type: string
          description: Date used in the filename, DDMMYYYY
        institutionCode:
          type: string
          default: IN2884
        version:
          type: string
          default: V1.3
        iraCode:
          type: string
          default: IRA010815
      required:
        - clientIds
        - fileDate
        - institutionCode
        - version
        - iraCode
    CkycDownloadBatchRequestInput:
      type: object
      properties:
        clientReferences:
          type: array
          minItems: 1
          items:
            type: string
          description: Optional LMS Client IDs, Loan IDs, or CKYC response IDs from the uploaded client file
        maxRows:
          type: number
          minimum: 1
          maximum: 1000000
          description: Maximum type 60 rows allowed in each generated CERSAI file
        sourceFileName:
          type: string
          description: Name of the uploaded client selection file
        fileDate:
          type: string
          description: Date used in the filename, DDMMYYYY
        disbursementFrom:
          type: string
          format: date
          description: Include LMS rows disbursed on or after this date
        disbursementTo:
          type: string
          format: date
          description: Include LMS rows disbursed on or before this date
        institutionCode:
          type: string
          default: IN2884
        version:
          type: string
